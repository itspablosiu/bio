<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bio.nalogowiec.pl</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #030406;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-hover: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: var(--font-main);
            color: var(--text-color);
            padding: 20px 10px 100px 10px;
        }

        #bgVideo {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.25) contrast(1.15) saturate(1.2);
            pointer-events: none;
        }

        /* GATEWAY - POPRAWIONY Z-INDEX I ODBIÓR KLIKNIĘĆ */
        #gateway {
            position: fixed;
            inset: 0;
            background: #000000;
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #gateway.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .gateway-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            pointer-events: none;
        }

        .core-pulse {
            width: 18px;
            height: 18px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.9);
            animation: pulseCore 2s infinite ease-in-out;
        }

        .gateway-text {
            font-size: 11px;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
            text-transform: uppercase;
        }

        @keyframes pulseCore {
            0%, 100% { transform: scale(0.85); opacity: 0.3; }
            50% { transform: scale(1.35); opacity: 1; box-shadow: 0 0 40px rgba(255, 255, 255, 1); }
        }

        /* KARTA BIO */
        .bio-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 30px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .bio-card.active {
            opacity: 1;
            transform: translateY(0);
        }

        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .avatar-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
        }

        .avatar-glow {
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 70%);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .profile-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .profile-subtitle {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .links-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .social-btn i {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
        }

        .social-btn:hover {
            background: var(--glass-hover);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* ODTWARZACZ */
        .bottom-controls {
            position: fixed;
            bottom: 20px;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(10, 10, 15, 0.75);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 8px 16px;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            max-width: 95vw;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .track-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .track-cover {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        .track-details {
            display: flex;
            flex-direction: column;
            max-width: 100px;
            overflow: hidden;
            white-space: nowrap;
        }

        .track-title {
            font-size: 11px;
            font-weight: 600;
            color: #ffffff;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        .track-artist {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.5);
            text-overflow: ellipsis;
            overflow: hidden;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .volume-icon {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 45px;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        /* POPRAWIONA SZEROKOŚĆ KÓŁKA SUWAKA */
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffffff;
        }

        .audio-progress-container {
            display: flex;
            align-items: center;
            gap: 6px;
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            padding-left: 10px;
        }

        .time-text {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
        }

        .progress-bar {
            width: 50px;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            cursor: pointer;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #ffffff;
        }

        #scrobble-info {
            display: none;
            align-items: center;
            gap: 6px;
            padding-left: 8px;
            border-left: 1px solid rgba(255, 255, 255, 0.12);
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        #scrobble-link {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            text-decoration: none;
        }

        .toast {
            position: fixed;
            top: 20px;
            background: #ffffff;
            color: #000000;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transform: translateY(-50px);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 100000;
        }

        .toast.active {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 480px) {
            .links-grid { grid-template-columns: 1fr; }
            .volume-container { display: none; }
            .track-details { max-width: 80px; }
            .progress-bar { width: 40px; }
        }
    </style>
</head>
<body>

    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i> Twój Nick Discord został skopiowany!
    </div>

    <div id="gateway" onclick="initPage()">
        <div class="gateway-content">
            <div class="core-pulse"></div>
            <span class="gateway-text">KLIKNIJ, ABY WEJŚĆ</span>
        </div>
    </div>

    <video id="bgVideo" loop muted playsinline onerror="this.style.display='none';">
        <source src="background.mp4" type="video/mp4">
    </video>

    <audio id="bgMusic" loop>
        <source src="02/background.mp3" type="audio/mpeg">
    </audio>

    <main class="bio-card" id="mainCard">
        <div class="profile-header">
            <div class="avatar-wrapper">
                <div class="avatar-glow"></div>
                <img src="avatar2.png" alt="Avatar" class="avatar-img">
            </div>
            <h1 class="profile-title">pawissek</h1>
            <p class="profile-subtitle">bio.nalogowiec.pl</p>
        </div>

        <div class="links-grid">
            <a href="https://youtube.com/@pawissek" target="_blank" rel="noopener noreferrer" class="social-btn">
                <i class="fab fa-youtube"></i>
                <span>YouTube</span>
            </a>
            <a href="https://github.com/itspablosiu" target="_blank" rel="noopener noreferrer" class="social-btn">
                <i class="fab fa-github"></i>
                <span>GitHub</span>
            </a>
            <a href="https://instagram.com/pawissek" target="_blank" rel="noopener noreferrer" class="social-btn">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
            </a>
            <button onclick="copyDiscord()" class="social-btn">
                <i class="fab fa-discord"></i>
                <span>Discord</span>
            </button>
            <a href="https://steamcommunity.com/id/pawissek/" target="_blank" rel="noopener noreferrer" class="social-btn">
                <i class="fab fa-steam"></i>
                <span>Steam</span>
            </a>
            <a href="https://x.com/pablosiu_" target="_blank" rel="noopener noreferrer" class="social-btn">
                <i class="fab fa-x-twitter"></i>
                <span>Twitter / X</span>
            </a>
            <a href="https://twitch.tv/pablosiu_" target="_blank" rel="noopener noreferrer" class="social-btn">
                <i class="fab fa-twitch"></i>
                <span>Twitch</span>
            </a>
            <a href="https://last.fm/user/arkadivsz" target="_blank" rel="noopener noreferrer" class="social-btn">
                <i class="fab fa-lastfm"></i>
                <span>Last.fm</span>
            </a>
        </div>
    </main>

    <footer class="bottom-controls">
        <button class="ctrl-btn" onclick="toggleAudio()" title="Pause/Play">
            <i class="fas fa-pause" id="playIcon"></i>
        </button>

        <div class="track-info">
            <img id="trackCover" src="cover.jpg" alt="Cover" class="track-cover">
            <div class="track-details">
                <span class="track-title" id="trackTitle">Ładowanie...</span>
                <span class="track-artist" id="trackArtist">Nieznany Wykonawca</span>
            </div>
        </div>

        <div class="volume-container">
            <i class="fas fa-volume-down volume-icon" id="volIcon" onclick="quickMuteToggle()"></i>
            <input type="range" class="volume-slider" id="volSlider" min="0" max="1" step="0.01" value="0.2" oninput="changeVolume(this.value)">
        </div>

        <div class="audio-progress-container">
            <span class="time-text" id="currentTime">0:00</span>
            <div class="progress-bar" onclick="seekAudio(event)">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="time-text" id="durationTime">0:00</span>
        </div>

        <div id="scrobble-info">
            <div class="live-dot" title="Słuchane na żywo"></div>
            <a id="scrobble-link" href="#" target="_blank" title="Otwórz w Spotify">
                <i class="fab fa-spotify"></i>
            </a>
        </div>
    </footer>

    <script>
        const DEFAULT_TRACK = {
            title: "KOSZT BYCIA BOSS",
            artist: "Kubi Producent, Bedoes 2115, kuqe 2115, Szpaku",
            cover: "cover.jpg"
        };

        const audio = document.getElementById('bgMusic');
        const video = document.getElementById('bgVideo');
        let previousVolume = 0.2;

        setTrackMetadata(DEFAULT_TRACK.title, DEFAULT_TRACK.artist, DEFAULT_TRACK.cover);

        function setTrackMetadata(title, artist, coverUrl) {
            document.getElementById('trackTitle').innerText = title;
            document.getElementById('trackArtist').innerText = artist;
            const coverEl = document.getElementById('trackCover');
            coverEl.src = coverUrl || DEFAULT_TRACK.cover;
        }

        function initPage() {
            document.getElementById('gateway').classList.add('hide');
            document.getElementById('mainCard').classList.add('active');

            if (video) {
                video.play().catch(() => { video.style.display = 'none'; });
            }
            if (audio) {
                audio.volume = parseFloat(document.getElementById('volSlider').value);
                audio.play().catch(() => {});
            }

            fetchLiveTrack();
            setInterval(fetchLiveTrack, 15000);
        }

        function toggleAudio() {
            const icon = document.getElementById('playIcon');
            if (!audio) return;
            if (audio.paused) {
                audio.play().catch(() => {});
                icon.className = "fas fa-pause";
            } else {
                audio.pause();
                icon.className = "fas fa-play";
            }
        }

        function changeVolume(val) {
            if (!audio) return;
            audio.volume = val;
            updateVolIcon(val);
        }

        function updateVolIcon(val) {
            const icon = document.getElementById('volIcon');
            const v = parseFloat(val);
            if (v === 0) icon.className = "fas fa-volume-mute volume-icon";
            else if (v < 0.5) icon.className = "fas fa-volume-down volume-icon";
            else icon.className = "fas fa-volume-up volume-icon";
        }

        function quickMuteToggle() {
            if (!audio) return;
            const slider = document.getElementById('volSlider');
            if (audio.volume > 0) {
                previousVolume = audio.volume;
                audio.volume = 0;
                slider.value = 0;
            } else {
                audio.volume = previousVolume > 0 ? previousVolume : 0.2;
                slider.value = audio.volume;
            }
            updateVolIcon(slider.value);
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        if (audio) {
            audio.addEventListener('timeupdate', () => {
                if (!audio.duration) return;
                const pct = (audio.currentTime / audio.duration) * 100;
                document.getElementById('progressFill').style.width = pct + '%';
                document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
                document.getElementById('durationTime').innerText = formatTime(audio.duration);
            });
        }

        function seekAudio(event) {
            if (!audio || !audio.duration) return;
            const bar = event.currentTarget;
            const rect = bar.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const pct = clickX / rect.width;
            audio.currentTime = pct * audio.duration;
        }

        const LF_USER = "arkadivsz";
        const LF_KEY = "0d22a6285362338637e9fe9eb97a1fd0";

        async function fetchLiveTrack() {
            if (!LF_USER || !LF_KEY) return;
            try {
                const res = await fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LF_USER}&api_key=${LF_KEY}&format=json&limit=1`);
                const json = await res.json();
                const track = json?.recenttracks?.track?.[0];
                const active = track?.['@attr']?.nowplaying === 'true';

                const container = document.getElementById('scrobble-info');
                const link = document.getElementById('scrobble-link');
                
                if (active && track) {
                    const artist = track.artist['#text'];
                    const name = track.name;
                    const coverUrl = track.image?.[2]?.['#text'] || track.image?.[1]?.['#text'] || DEFAULT_TRACK.cover;
                    
                    setTrackMetadata(name, artist, coverUrl);
                    container.style.display = 'flex';
                    link.title = `Słuchasz na żywo: ${artist} - ${name}`;
                    link.href = `https://open.spotify.com/search/${encodeURIComponent(artist + " " + name)}`;
                } else {
                    setTrackMetadata(DEFAULT_TRACK.title, DEFAULT_TRACK.artist, DEFAULT_TRACK.cover);
                    container.style.display = 'none';
                }
