<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xarex</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- MANGA & CYBERPUNK THEME --- */
        :root {
            --bg-dark: #0d0c10;
            --anime-pink: #ff2a74;
            --anime-cyan: #00f0ff;
            --anime-purple: #7000ff;
            --font-manga: 'Bangers', cursive;
            --font-clean: 'Plus Jakarta Sans', sans-serif;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            background: var(--bg-dark);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: var(--font-clean);
        }

        /* --- RETRO CRT LINES (ZOPTYMALIZOWANE - lżejsze dla procesora) --- */
        .crt-lines {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* --- OVERLAY INTERFEJSU (Usunięto blur, który zabijał FPS-y) --- */
        #overlay {
            position: fixed;
            inset: 0;
            background: #0d0c10; /* Czysty kolor zamiast przezroczystości z blurem */
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 10px solid #000;
            opacity: 1;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #overlay.hidden { 
            opacity: 0; 
            visibility: hidden; 
        }
        #overlay span {
            font-family: var(--font-manga);
            font-size: 32px;
            color: var(--anime-pink);
            text-shadow: 3px 3px 0px #000, 0 0 20px rgba(255, 42, 116, 0.6);
            letter-spacing: 3px;
        }
        .anime-pulse { animation: glitchPulse 1.5s infinite steps(2); }

        @keyframes glitchPulse {
            0%, 100% { transform: scale(1) skewX(-5deg); color: var(--anime-pink); }
            50% { transform: scale(1.02) skewX(5deg); color: var(--anime-cyan); text-shadow: -3px -3px 0px #000; }
        }

        /* --- BG VIDEO --- */
        #bgVideo {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            object-fit: cover;
            filter: brightness(0.35) saturate(1.3);
        }

        /* --- KONTENER GŁÓWNY (KARTA) --- */
        .main-wrapper {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 500px;
            background: rgba(13, 12, 16, 0.95);
            border: 4px solid #000;
            box-shadow: 12px 12px 0px rgba(112, 0, 255, 0.5);
            padding: 40px 30px;
            opacity: 0;
            transform: scale(0.95) rotate(-1deg);
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .main-wrapper.visible { opacity: 1; transform: scale(1) rotate(0deg); }

        /* --- PROFIL --- */
        .profile-header { text-align: center; margin-bottom: 30px; width: 100%; }
        .av-box { position: relative; width: 120px; height: 120px; margin: 0 auto 20px; }
        .av-box img { width: 100%; height: 100%; object-fit: cover; border: 4px solid #000; box-shadow: 5px 5px 0px var(--anime-pink); }
        .av-badge { position: absolute; bottom: -5px; right: -10px; background: #ffff00; color: #000; font-family: var(--font-manga); font-size: 11px; padding: 2px 8px; border: 2px solid #000; transform: rotate(8deg); z-index: 2; }

        .name { font-family: var(--font-manga); font-size: 55px; color: white; text-shadow: 4px 4px 0px var(--anime-purple), 7px 7px 0px #000; letter-spacing: 2px; line-height: 1; margin-bottom: 5px; }
        .loc-badge { background: #000; padding: 6px 15px; display: inline-block; transform: skewX(-15deg); border-left: 4px solid var(--anime-cyan); }
        .loc { color: var(--anime-cyan); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; transform: skewX(15deg); }

        /* --- SOCIAL GRID --- */
        .social-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; width: 100%; }
        .btn { width: calc(25% - 12px); aspect-ratio: 1/1; background: #131217; border: 3px solid #000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-decoration: none; color: white; position: relative; transition: transform 0.1s ease, background-color 0.1s ease; }

        @media (max-width: 440px) { .btn { width: calc(33.33% - 10px); } }
        .btn i { font-size: 24px; margin-bottom: 6px; z-index: 2; }
        .btn span { font-family: var(--font-manga); font-size: 14px; letter-spacing: 0.5px; z-index: 2; color: #fff; }

        .btn:hover { color: #000; transform: translate(-4px, -4px); }
        .btn:hover span { color: #000; }

        .btn-yt:hover { background: #FF0000; box-shadow: 4px 4px 0 #ffff00; border-color: #000; }
        .btn-ig:hover { background: var(--anime-pink); box-shadow: 4px 4px 0 var(--anime-cyan); border-color: #000; }
        .btn-gh:hover { background: #fff; box-shadow: 4px 4px 0 var(--anime-purple); border-color: #000; }
        .btn-dsc:hover { background: #5865F2; box-shadow: 4px 4px 0 #ffff00; border-color: #000; }
        .btn-stm:hover { background: var(--anime-cyan); box-shadow: 4px 4px 0 var(--anime-pink); border-color: #000; }
        .btn-x:hover { background: #fff; box-shadow: 4px 4px 0 #000; border-color: #000; }
        .btn-ttv:hover { background: #9146FF; box-shadow: 4px 4px 0 var(--anime-cyan); border-color: #000; }

        /* --- WIDGET SPOTIFY --- */
        #spotify { margin-top: 30px; background: #ffff00; color: #000; border: 3px solid #000; box-shadow: 5px 5px 0px var(--anime-pink); padding: 8px 16px; font-family: var(--font-manga); font-size: 15px; letter-spacing: 1px; display: none; align-items: center; gap: 12px; transform: skewX(-8deg); }
        .eq-container { display: flex; align-items: flex-end; gap: 3px; width: 14px; height: 14px; transform: skewX(8deg); }
        .bar { width: 3px; height: 100%; background: #000; animation: musicAnime 0.6s steps(4) infinite alternate; transform-origin: bottom; }
        .bar:nth-child(2) { animation-delay: 0.15s; }
        .bar:nth-child(3) { animation-delay: 0.30s; }

        @keyframes musicAnime { from { transform: scaleY(0.2); } to { transform: scaleY(1); } }
        #track-name { transform: skewX(8deg); }

        /* --- TOAST --- */
        .copy-notification { position: fixed; bottom: 30px; right: 30px; background: var(--anime-purple); border: 3px solid #000; box-shadow: 5px 5px 0px #ffff00; color: white; padding: 12px 24px; font-family: var(--font-manga); font-size: 18px; letter-spacing: 1px; z-index: 10000; transform: translateY(200%) skewX(-10deg); transition: transform 0.2s ease; display: flex; align-items: center; gap: 10px; }
        .copy-notification.show { transform: translateY(0) skewX(-10deg); }
        .copy-notification i { color: #ffff00; }

        /* --- RESPONSIVE AUDIO PLAYER --- */
        .anime-player {
            z-index: 100;
            display: flex;
            background: #0d0c10;
            border: 3px solid var(--anime-pink);
            box-shadow: 4px 4px 0px var(--anime-purple);
            padding: 4px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .main-wrapper.visible .anime-player { opacity: 1; }

        .anime-player button {
            background: none;
            border: none;
            color: #fff;
            font-size: 16px;
            padding: 10px;
            cursor: pointer;
            transition: color 0.15s ease, transform 0.15s ease;
        }
        .anime-player button:hover { color: var(--anime-cyan); }

        /* PC View */
        @media (min-width: 769px) {
            .anime-player {
                position: absolute;
                top: 45px;
                right: -60px;
                flex-direction: column;
                transform: skewY(-10deg);
            }
            .anime-player button { transform: skewY(10deg); }
            .anime-player button:hover { transform: skewY(10deg) scale(1.15); }
            .player-divider { width: 18px; height: 3px; background: var(--anime-pink); margin: 4px 0; }
        }

        /* Mobile View */
        @media (max-width: 768px) {
            .anime-player {
                position: relative;
                top: 0;
                right: 0;
                margin: 0 auto 25px auto;
                flex-direction: row;
                transform: skewX(-12deg);
                width: fit-content;
            }
            .anime-player button { transform: skewX(12deg); }
            .anime-player button:hover { transform: skewX(12deg) scale(1.15); }
            .player-divider { width: 3px; height: 18px; background: var(--anime-pink); margin: 0 4px; }
        }
    </style>
</head>
<body>

    <div class="crt-lines"></div>

    <div id="copy-toast" class="copy-notification">
        <i class="fas fa-comment-dots"></i> DISCORD COPIED!
    </div>

    <div id="overlay" onclick="startExperience()">
        <span class="anime-pulse">[ A KLIKNIJ SE ]</span>
    </div>

    <video muted loop playsinline id="bgVideo">
        <source src="bg.mp4" type="video/mp4">
    </video>

    <audio id="bgMusic" loop>
        <source src="background.mp3" type="audio/mpeg">
    </audio>

    <div class="main-wrapper" id="content">
        
        <div class="anime-player" id="audioPlayer">
            <button onclick="togglePlay()" title="Play/Pause">
                <i class="fas fa-pause" id="playIcon"></i>
            </button>
            <div class="player-divider"></div>
            <button onclick="toggleMute()" title="Mute/Unmute">
                <i class="fas fa-volume-up" id="muteIcon"></i>
            </button>
        </div>

        <div class="profile-header">
            <div class="av-box">
                <img src="avatar.png" id="av" alt="Avatar">
                <div class="av-badge">D0 DOMKU</div>
            </div>
            <h1 class="name">Pablosiu</h1>
            <div class="loc-badge">
                <p class="loc">Purpur to cwel</p>
            </div>
        </div>

        <div class="social-grid">
            <a href="https://youtube.com/@xrxwastaken" target="_blank" rel="noopener noreferrer" class="btn btn-yt"><i class="fab fa-youtube"></i><span>YT</span></a>
            <a href="https://instagram.com/pawissek" target="_blank" rel="noopener noreferrer" class="btn btn-ig"><i class="fab fa-instagram"></i><span>IG</span></a>
            <a href="https://github.com/itspablosiu" target="_blank" rel="noopener noreferrer" class="btn btn-gh"><i class="fab fa-github"></i><span>GH</span></a>
            <a href="#" onclick="copyDiscord(event)" class="btn btn-dsc"><i class="fab fa-discord"></i><span>DSC</span></a>
            <a href="https://steamcommunity.com/id/clcv/" target="_blank" rel="noopener noreferrer" class="btn btn-stm"><i class="fab fa-steam"></i><span>STM</span></a>
            <a href="https://x.com/pablosiu_" target="_blank" rel="noopener noreferrer" class="btn btn-x"><i class="fab fa-x-twitter"></i><span>X</span></a>
            <a href="https://twitch.tv/clcv_" target="_blank" rel="noopener noreferrer" class="btn btn-ttv"><i class="fab fa-twitch"></i><span>TTV</span></a>
        </div>

        <div id="spotify">
            <div class="eq-container">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <span id="track-name">NOW PLAYING</span>
        </div>
    </div>

    <script>
        const audio = document.getElementById('bgMusic');
        const video = document.getElementById('bgVideo');

        function startExperience() {
            // Natychmiast ukrywamy overlay, żeby odblokować interfejs
            document.getElementById('overlay').classList.add('hidden');
            document.getElementById('content').classList.add('visible');

            // Odpalanie wideo i audio opakowane w try-catch, by żaden błąd nie zaciął skryptu
            if (video) {
                video.play().catch(e => console.log("Video playback delayed:", e));
            }

            if (audio) {
                audio.volume = 0.3;
                audio.play().catch(e => console.log("Audio playback delayed:", e));
            }
        }

        function togglePlay() {
            const icon = document.getElementById('playIcon');
            if (!audio) return;
            
            if (audio.paused) {
                audio.play().catch(() => {});
                icon.className = "fas fa-pause";
            } else {
                audio.pause();
                icon.className = "fas fa-play";
            }
        }

        function toggleMute() {
            const icon = document.getElementById('muteIcon');
            if (!audio) return;

            if (audio.muted) {
                audio.muted = false;
                icon.className = "fas fa-volume-up";
            } else {
                audio.muted = true;
                icon.className = "fas fa-volume-mute";
            }
        }

        const LFM_USER = "arkadivsz";
        const LFM_API_KEY = "0d22a6285362338637e9fe9eb97a1fd0";

        async function updateSpotify() {
            try {
                const r = await fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LFM_USER}&api_key=${LFM_API_KEY}&format=json&limit=1`);
                const data = await r.json();
                const track = data?.recenttracks?.track?.[0];
                const isPlaying = track?.['@attr']?.nowplaying === 'true';

                const sp = document.getElementById('spotify');
                if(isPlaying && track) {
                    sp.style.display = 'flex';
                    document.getElementById('track-name').innerText = `${track.artist['#text']} - ${track.name}`.toUpperCase();
                } else {
                    sp.style.display = 'none';
                }
            } catch(err) {
                console.log("LastFM error ignored");
            }
        }

        function copyDiscord(event) {
            if (event) event.preventDefault();
            navigator.clipboard.writeText('xrxwastaken').then(() => {
                const toast = document.getElementById('copy-toast');
                if (toast) {
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 3000);
                }
            });
        }

        // Bezpieczne uruchomienie widgetu Spotify
        if(LFM_USER && LFM_API_KEY) {
            updateSpotify();
            setInterval(updateSpotify, 20000);
        }
    </script>
</body>
</html>
