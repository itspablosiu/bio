<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xarexowa stronka bo czemu nie</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #08090d;
            --franxx-red: #ff1f44;
            --franxx-blue: #00e5ff;
            --franxx-white: #f4f5f7;
            --font-manga: 'Bangers', cursive;
            --font-hud: 'Share Tech Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--franxx-white);
            font-family: var(--font-hud);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- BACKGROUND & CRT --- */
        #bgVideo, #bgImage {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.35) saturate(1.1);
        }

        .crt-hud {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* --- GATEWAY OVERLAY --- */
        #gateway {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 4px solid var(--franxx-red);
        }
        #gateway.hide {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .gateway-title {
            font-family: var(--font-manga);
            font-size: 48px;
            color: var(--franxx-white);
            letter-spacing: 4px;
            text-shadow: 4px 4px 0px var(--franxx-red);
            margin-bottom: 10px;
        }
        .gateway-sub {
            font-size: 14px;
            color: var(--franxx-blue);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- INTERFEJS HUD --- */
        .hud-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 850px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .hud-container.active {
            opacity: 1;
            transform: translateY(0);
        }

        @media (min-width: 768px) {
            .hud-container {
                grid-template-columns: 260px 1fr;
            }
        }

        /* --- LEWY PANEL: PILOT DATA --- */
        .hud-pilot-panel {
            background: rgba(13, 15, 22, 0.85);
            border-left: 5px solid var(--franxx-red);
            border-top: 5px solid var(--franxx-red);
            border-bottom: 2px solid #000;
            border-right: 2px solid #000;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 85% 100%, 0 100%);
            backdrop-filter: blur(5px);
        }

        .avatar-frame {
            position: relative;
            width: 140px;
            height: 140px;
            margin-bottom: 20px;
        }
        .avatar-frame::before {
            content: '';
            position: absolute;
            inset: -8px;
            border: 2px solid var(--franxx-blue);
            clip-path: polygon(0 0, 30% 0, 0 30%, 0 100%, 100% 100%, 100% 0);
            pointer-events: none;
        }
        .avatar-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 3px solid #000;
        }

        .pilot-code {
            font-size: 13px;
            color: var(--franxx-blue);
            letter-spacing: 3px;
            margin-bottom: 5px;
        }
        .pilot-name {
            font-family: var(--font-manga);
            font-size: 42px;
            color: var(--franxx-white);
            text-shadow: 3px 3px 0 var(--franxx-red);
            line-height: 1;
            margin-bottom: 15px;
        }

        .status-badge {
            background: var(--franxx-red);
            color: #000;
            font-weight: bold;
            padding: 4px 12px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transform: skewX(-15deg);
        }

        /* --- PRAWY PANEL: MATRYCA LINKÓW --- */
        .hud-main-panel {
            background: rgba(13, 15, 22, 0.85);
            border-right: 5px solid var(--franxx-blue);
            border-bottom: 5px solid var(--franxx-blue);
            border-top: 2px solid #000;
            border-left: 2px solid #000;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            clip-path: polygon(12% 0, 100% 0, 100% 100%, 0 100%, 0 15%);
            backdrop-filter: blur(5px);
        }

        .panel-title-hud {
            font-size: 12px;
            letter-spacing: 4px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .hud-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
            width: 100%;
            margin-bottom: 15px;
        }

        .hud-btn {
            background: #151821;
            border: 2px solid #232736;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--franxx-white);
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
        }
        .hud-btn i { font-size: 20px; margin-bottom: 8px; transition: transform 0.2s ease; }
        .hud-btn span { font-size: 11px; font-weight: bold; letter-spacing: 1px; }

        .hud-btn::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 0; height: 0;
            border-style: solid;
            border-width: 0 0 10px 10px;
            border-color: transparent transparent var(--franxx-red) transparent;
            transition: all 0.2s ease;
        }

        .hud-btn:hover {
            border-color: var(--franxx-blue);
            background: #1a1e2a;
            transform: translateY(-2px);
        }
        .hud-btn:hover i { transform: scale(1.15); color: var(--franxx-blue); }
        .hud-btn:hover::after { border-color: transparent transparent var(--franxx-blue) transparent; }

        /* --- SPOTIFY WIDGET --- */
        #spotify-hud {
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(0, 229, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-left: 4px solid var(--franxx-blue);
            padding: 8px 15px;
            font-size: 11px;
            letter-spacing: 1px;
            width: 100%;
            margin-bottom: 15px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .live-pulse {
            width: 6px;
            height: 6px;
            background: var(--franxx-blue);
            border-radius: 50%;
            flex-shrink: 0;
            animation: pulseGlow 1s infinite alternate;
        }
        @keyframes pulseGlow { from { opacity: 0.3; } to { opacity: 1; } }

        /* --- DOLNY PANEL MEDIA CONTROLS --- */
        .hud-media-bar {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
        }

        .hud-player-controls { display: flex; gap: 8px; }
        .hud-player-controls button {
            background: #151821;
            border: 1px solid #232736;
            color: #fff;
            padding: 8px 16px;
            cursor: pointer;
            font-family: var(--font-hud);
            font-size: 12px;
            letter-spacing: 1px;
            transition: all 0.15s ease;
        }
        .hud-player-controls button:hover {
            background: var(--franxx-red);
            color: #000;
            border-color: var(--franxx-red);
        }

        /* --- NOTYFIKATOR SYSTEMOWY --- */
        .hud-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--franxx-red);
            color: #000;
            padding: 10px 20px;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 2px;
            border-left: 4px solid var(--franxx-white);
            transform: translateX(150%);
            transition: transform 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            z-index: 10000;
        }
        .hud-toast.active { transform: translateX(0); }
    </style>
</head>
<body>

    <div class="crt-hud"></div>

    <div id="toast" class="hud-toast">SYSTEM_MSG: DISCORD_COPIED</div>

    <!-- EKRAN SYNCU -->
    <div id="gateway" onclick="connectToFranxx()">
        <div class="gateway-title">CONNECT TO FRANXX</div>
        <div class="gateway-sub">Click to initiate pilot synchronization</div>
    </div>

    <video id="bgVideo" loop muted playsinline>
        <source src="02/background.mp4" type="video/mp4">
    </video>
    <img src="02/background.png" id="bgImage" alt="Background">

    <audio id="bgMusic" loop>
        <source src="02/background.mp3" type="audio/mpeg">
    </audio>

    <!-- GŁÓWNA STRUKTURA HUD -->
    <div class="hud-container" id="hudFrame">
        
        <!-- LEWY PANEL: PILOT PROFILE -->
        <div class="hud-pilot-panel">
            <div class="avatar-frame">
                <img src="02/avatar.png" alt="Pilot Avatar">
            </div>
            <div class="pilot-code">CODE: 002</div>
            <div class="pilot-name">xarex</div>
            <div class="status-badge">Purpur to cwel</div>
        </div>

        <!-- PRAWY PANEL: MATRYCA SYSTEMOWA -->
        <div class="hud-main-panel">
            <div>
                <div class="panel-title-hud">
                    <span>PILOT LINK MATRIX</span>
                    <span>STRELIZIA_OS_V2</span>
                </div>
                
                <div class="hud-grid">
                    <a href="https://youtube.com/@xrxwastaken" target="_blank" rel="noopener noreferrer" class="hud-btn"><i class="fab fa-youtube"></i><span>YOUTUBE</span></a>
                    <a href="https://instagram.com/pawissek" target="_blank" rel="noopener noreferrer" class="hud-btn"><i class="fab fa-instagram"></i><span>INSTAGRAM</span></a>
                    <a href="https://github.com/itspablosiu" target="_blank" rel="noopener noreferrer" class="hud-btn"><i class="fab fa-github"></i><span>GITHUB</span></a>
                    <a href="#" onclick="copyDiscord(event)" class="hud-btn"><i class="fab fa-discord"></i><span>DISCORD</span></a>
                    <a href="https://steamcommunity.com/id/clcv/" target="_blank" rel="noopener noreferrer" class="hud-btn"><i class="fab fa-steam"></i><span>STEAM</span></a>
                    <a href="https://x.com/pablosiu_" target="_blank" rel="noopener noreferrer" class="hud-btn"><i class="fab fa-x-twitter"></i><span>X / TWITTER</span></a>
                    <a href="https://twitch.tv/clcv_" target="_blank" rel="noopener noreferrer" class="hud-btn"><i class="fab fa-twitch"></i><span>TWITCH</span></a>
                </div>

                <!-- PRZENIESIONY WIDGET SPOTIFY -->
                <div id="spotify-hud">
                    <div class="live-pulse"></div>
                    <span id="track-string">HUD_IDLE</span>
                </div>
            </div>

            <!-- DOLNY PANEL: MEDIA CONTROLS -->
            <div class="hud-media-bar">
                <div class="hud-player-controls">
                    <button onclick="triggerAudio()"><i class="fas fa-pause" id="playIcon"></i> PLAY</button>
                    <button onclick="triggerMute()"><i class="fas fa-volume-up" id="muteIcon"></i> MUTE</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const audioSystem = document.getElementById('bgMusic');
        const videoSystem = document.getElementById('bgVideo');

        function connectToFranxx() {
            document.getElementById('gateway').classList.add('hide');
            document.getElementById('hudFrame').classList.add('active');

            if (videoSystem) videoSystem.play().catch(() => {});
            if (audioSystem) {
                audioSystem.volume = 0.25;
                audioSystem.play().catch(() => {});
            }
        }

        function triggerAudio() {
            const icon = document.getElementById('playIcon');
            if (!audioSystem) return;
            if (audioSystem.paused) {
                audioSystem.play().catch(() => {});
                icon.className = "fas fa-pause";
            } else {
                audioSystem.pause();
                icon.className = "fas fa-play";
            }
        }

        function triggerMute() {
            const icon = document.getElementById('muteIcon');
            if (!audioSystem) return;
            if (audioSystem.muted) {
                audioSystem.muted = false;
                icon.className = "fas fa-volume-up";
            } else {
                audioSystem.muted = true;
                icon.className = "fas fa-volume-mute";
            }
        }

        const LF_USER = "arkadivsz";
        const LF_KEY = "0d22a6285362338637e9fe9eb97a1fd0";

        async function fetchLiveTrack() {
            if(!LF_USER || !LF_KEY) return;
            try {
                const res = await fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LF_USER}&api_key=${LF_KEY}&format=json&limit=1`);
                const json = await res.json();
                const track = json?.recenttracks?.track?.[0];
                const active = track?.['@attr']?.nowplaying === 'true';

                const element = document.getElementById('spotify-hud');
                if(active && track) {
                    element.style.display = 'flex';
                    document.getElementById('track-string').innerText = `${track.artist['#text']} - ${track.name}`.toUpperCase();
                } else {
                    element.style.display = 'none';
                }
            } catch(e) {}
        }

        function copyDiscord(e) {
            if (e) e.preventDefault();
            navigator.clipboard.writeText('xrxwastaken').then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('active');
                setTimeout(() => toast.classList.remove('active'), 2500);
            });
        }

        fetchLiveTrack();
        setInterval(fetchLiveTrack, 20000);
    </script>
</body>
</html>
