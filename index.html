<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xarex</title>
    
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- BRANDING: DARLING IN THE FRANXX --- */
        :root {
            --bg-dark: #0a0b10;
            --franxx-red: #ff1f44;   /* Krwista czerwień Zero Two */
            --franxx-blue: #00e5ff;  /* Neonowy błękit Hiro / Strelizia */
            --franxx-white: #ffffff; /* Czysta biel kokpitu */
            
            --font-display: 'Bangers', cursive;
            --font-base: 'Plus Jakarta Sans', sans-serif;
        }

        /* --- BASE SYSTEM RESET --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--franxx-white);
            font-family: var(--font-base);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- BACKGROUND STREAMING VIDEO --- */
        #bgVideo {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.3) saturate(1.2);
        }

        /* --- LIGHT CRT OVERLAY EFFECT --- */
        .crt-layer {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* --- INTERFACE TOAST --- */
        .toast-notification {
            position: fixed;
            bottom: -100px;
            right: 30px;
            background: var(--franxx-red);
            border: 3px solid #000;
            box-shadow: 5px 5px 0px var(--franxx-white);
            color: var(--franxx-white);
            padding: 12px 24px;
            font-family: var(--font-display);
            font-size: 18px;
            letter-spacing: 1px;
            z-index: 999;
            transform: skewX(-10deg);
            transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.25);
        }
        .toast-notification.active {
            bottom: 30px;
        }

        /* --- SECURITY GATE (OVERLAY) --- */
        #gateway {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 8px solid #000;
        }
        #gateway.hide {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .gateway-prompt {
            font-family: var(--font-display);
            font-size: 36px;
            color: var(--franxx-red);
            text-shadow: 3px 3px 0px #000, 0 0 15px rgba(255, 31, 68, 0.5);
            letter-spacing: 2px;
            animation: pulseSync 1.2s infinite steps(2);
        }

        @keyframes pulseSync {
            0%, 100% { transform: scale(1) skewX(-5deg); color: var(--franxx-red); }
            50% { transform: scale(1.03) skewX(5deg); color: var(--franxx-blue); text-shadow: -3px -3px 0px #000; }
        }

        /* --- THE CENTRAL UNIT (MAIN CARD) --- */
        .profile-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 480px;
            background: rgba(10, 11, 16, 0.95);
            border: 4px solid #000;
            box-shadow: 12px 12px 0px rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .profile-card.active {
            opacity: 1;
            transform: scale(1);
        }

        /* --- HEADER NODE --- */
        .card-header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
        }
        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 4px solid #000;
            box-shadow: 5px 5px 0px var(--franxx-red);
        }
        .avatar-status {
            position: absolute;
            bottom: -5px;
            right: -12px;
            background: #ffff00;
            color: #000;
            font-family: var(--font-display);
            font-size: 12px;
            padding: 2px 10px;
            border: 2px solid #000;
            transform: rotate(6deg);
            z-index: 2;
        }

        .username {
            font-family: var(--font-display);
            font-size: 56px;
            color: var(--franxx-white);
            text-shadow: 4px 4px 0px var(--franxx-red), 7px 7px 0px #000;
            letter-spacing: 2px;
            line-height: 1;
            margin-bottom: 8px;
        }
        .sub-tag-box {
            background: #000;
            padding: 6px 16px;
            display: inline-block;
            transform: skewX(-15deg);
            border-left: 4px solid var(--franxx-blue);
        }
        .sub-tag-text {
            color: var(--franxx-blue);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            transform: skewX(15deg);
        }

        /* --- GRID CORE (SOCIAL BUTTONS) --- */
        .social-matrix {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            width: 100%;
        }
        .matrix-btn {
            width: calc(25% - 11px);
            aspect-ratio: 1 / 1;
            background: #12141c;
            border: 3px solid #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: var(--franxx-white);
            transition: transform 0.1s ease, background-color 0.1s ease;
        }

        @media (max-width: 440px) {
            .matrix-btn { width: calc(33.33% - 10px); }
        }

        .matrix-btn i { font-size: 24px; margin-bottom: 6px; z-index: 2; }
        .matrix-btn span { font-family: var(--font-display); font-size: 14px; letter-spacing: 0.5px; z-index: 2; }

        .matrix-btn:hover { color: #000; transform: translate(-4px, -4px); }

        .btn-yt:hover { background: #FF0000; box-shadow: 4px 4px 0 #ffff00; border-color: #000; }
        .btn-ig:hover { background: var(--franxx-red); box-shadow: 4px 4px 0 var(--franxx-blue); border-color: #000; }
        .btn-gh:hover { background: var(--franxx-white); box-shadow: 4px 4px 0 var(--franxx-red); border-color: #000; }
        .btn-dsc:hover { background: #5865F2; box-shadow: 4px 4px 0 #ffff00; border-color: #000; }
        .btn-stm:hover { background: var(--franxx-blue); box-shadow: 4px 4px 0 var(--franxx-red); border-color: #000; }
        .btn-x:hover { background: var(--franxx-white); box-shadow: 4px 4px 0 #000; border-color: #000; }
        .btn-ttv:hover { background: #9146FF; box-shadow: 4px 4px 0 var(--franxx-blue); border-color: #000; }

        /* --- SOUNDTRACK NODE (SPOTIFY) --- */
        #spotify-node {
            margin-top: 35px;
            background: #ffff00;
            color: #000;
            border: 3px solid #000;
            box-shadow: 5px 5px 0px var(--franxx-red);
            padding: 8px 16px;
            font-family: var(--font-display);
            font-size: 15px;
            letter-spacing: 1px;
            display: none;
            align-items: center;
            gap: 12px;
            transform: skewX(-8deg);
        }
        .eq-bars { display: flex; align-items: flex-end; gap: 3px; width: 14px; height: 14px; transform: skewX(8deg); }
        .eq-bar { width: 3px; height: 100%; background: #000; animation: audioJump 0.6s steps(4) infinite alternate; transform-origin: bottom; }
        .eq-bar:nth-child(2) { animation-delay: 0.15s; }
        .eq-bar:nth-child(3) { animation-delay: 0.30s; }

        @keyframes audioJump { from { transform: scaleY(0.2); } to { transform: scaleY(1); } }
        #track-string { transform: skewX(8deg); }

        /* --- FRANXX COCKPIT MEDIA MODULE (AUDIO PLAYER) --- */
        .franxx-player {
            z-index: 100;
            display: flex;
            background: var(--bg-dark);
            border: 3px solid var(--franxx-red);
            box-shadow: 4px 4px 0px var(--franxx-white);
            padding: 4px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .profile-card.active .franxx-player { opacity: 1; }

        .franxx-player button {
            background: none;
            border: none;
            color: var(--franxx-white);
            font-size: 16px;
            padding: 10px;
            cursor: pointer;
            transition: color 0.15s ease, transform 0.15s ease;
        }
        .franxx-player button:hover { color: var(--franxx-blue); }

        /* PC Layout Matrix */
        @media (min-width: 769px) {
            .franxx-player {
                position: absolute;
                top: 45px;
                right: -62px;
                flex-direction: column;
                transform: skewY(-10deg);
            }
            .franxx-player button { transform: skewY(10deg); }
            .franxx-player button:hover { transform: skewY(10deg) scale(1.15); }
            .player-pipe { width: 18px; height: 3px; background: var(--franxx-red); margin: 4px 0; }
        }

        /* Mobile Layout Matrix */
        @media (max-width: 768px) {
            .franxx-player {
                position: relative;
                top: 0;
                right: 0;
                margin: 0 auto 25px auto;
                flex-direction: row;
                transform: skewX(-12deg);
                width: fit-content;
            }
            .franxx-player button { transform: skewX(12deg); }
            .franxx-player button:hover { transform: skewX(12deg) scale(1.15); }
            .player-pipe { width: 3px; height: 18px; background: var(--franxx-red); margin: 0 4px; }
        }
    </style>
</head>
<body>

    <div class="crt-layer"></div>

    <div id="toast" class="toast-notification">
        <i class="fas fa-comment-dots"></i> DISCORD COPIED!
    </div>

    <div id="gateway" onclick="initializeProfile()">
        <span class="gateway-prompt">[ CONNECT TO FRANXX ]</span>
    </div>

    <video muted loop playsinline id="bgVideo">
        <source src="bg.mp4" type="video/mp4">
    </video>

    <audio id="bgMusic" loop>
        <source src="background.mp3" type="audio/mpeg">
    </audio>

    <div class="profile-card" id="mainCard">
        
        <!-- FLUID AUDIO CONTROLLER -->
        <div class="franxx-player" id="mediaController">
            <button onclick="controlAudio()" title="Play/Pause">
                <i class="fas fa-pause" id="playIcon"></i>
            </button>
            <div class="player-pipe"></div>
            <button onclick="controlMute()" title="Mute/Unmute">
                <i class="fas fa-volume-up" id="muteIcon"></i>
            </button>
        </div>

        <div class="card-header">
            <div class="avatar-container">
                <img src="avatar.png" id="avatarImg" alt="Avatar">
                <div class="avatar-status">D0 DOMKU</div>
            </div>
            <h1 class="username">Pablosiu</h1>
            <div class="sub-tag-box">
                <p class="sub-tag-text">Purpur to cwel</p>
            </div>
        </div>

        <div class="social-matrix">
            <a href="https://youtube.com/@xrxwastaken" target="_blank" rel="noopener noreferrer" class="matrix-btn btn-yt"><i class="fab fa-youtube"></i><span>YT</span></a>
            <a href="https://instagram.com/pawissek" target="_blank" rel="noopener noreferrer" class="matrix-btn btn-ig"><i class="fab fa-instagram"></i><span>IG</span></a>
            <a href="https://github.com/itspablosiu" target="_blank" rel="noopener noreferrer" class="matrix-btn btn-gh"><i class="fab fa-github"></i><span>GH</span></a>
            <a href="#" onclick="copyDiscordHandle(event)" class="matrix-btn btn-dsc"><i class="fab fa-discord"></i><span>DSC</span></a>
            <a href="https://steamcommunity.com/id/clcv/" target="_blank" rel="noopener noreferrer" class="matrix-btn btn-stm"><i class="fab fa-steam"></i><span>STM</span></a>
            <a href="https://x.com/pablosiu_" target="_blank" rel="noopener noreferrer" class="matrix-btn btn-x"><i class="fab fa-x-twitter"></i><span>X</span></a>
            <a href="https://twitch.tv/clcv_" target="_blank" rel="noopener noreferrer" class="matrix-btn btn-ttv"><i class="fab fa-twitch"></i><span>TTV</span></a>
        </div>

        <div id="spotify-node">
            <div class="eq-bars">
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
            </div>
            <span id="track-string">SYSTEM IDLE</span>
        </div>
    </div>

    <script>
        const musicSystem = document.getElementById('bgMusic');
        const videoSystem = document.getElementById('bgVideo');

        function initializeProfile() {
            document.getElementById('gateway').classList.add('hide');
            document.getElementById('mainCard').classList.add('active');

            if (videoSystem) {
                videoSystem.play().catch(err => console.log("Video track hold:", err));
            }

            if (musicSystem) {
                musicSystem.volume = 0.3;
                musicSystem.play().catch(err => console.log("Audio track hold:", err));
            }
        }

        function controlAudio() {
            const btnIcon = document.getElementById('playIcon');
            if (!musicSystem) return;
            
            if (musicSystem.paused) {
                musicSystem.play().catch(() => {});
                btnIcon.className = "fas fa-pause";
            } else {
                musicSystem.pause();
                btnIcon.className = "fas fa-play";
            }
        }

        function controlMute() {
            const btnIcon = document.getElementById('muteIcon');
            if (!musicSystem) return;

            if (musicSystem.muted) {
                musicSystem.muted = false;
                btnIcon.className = "fas fa-volume-up";
            } else {
                musicSystem.muted = true;
                btnIcon.className = "fas fa-volume-mute";
            }
        }

        const LASTFM_TARGET = "arkadivsz";
        const LASTFM_KEY = "0d22a6285362338637e9fe9eb97a1fd0";

        async function syncSpotifyData() {
            if(!LASTFM_TARGET || !LASTFM_KEY) return;
            try {
                const response = await fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LASTFM_TARGET}&api_key=${LASTFM_KEY}&format=json&limit=1`);
                const parsed = await response.json();
                const currentTrack = parsed?.recenttracks?.track?.[0];
                const activeState = currentTrack?.['@attr']?.nowplaying === 'true';

                const displayContainer = document.getElementById('spotify-node');
                if(activeState && currentTrack) {
                    displayContainer.style.display = 'flex';
                    document.getElementById('track-string').innerText = `${currentTrack.artist['#text']} - ${currentTrack.name}`.toUpperCase();
                } else {
                    displayContainer.style.display = 'none';
                }
            } catch(e) {
                console.log("Sync error bypassed.");
            }
        }

        function copyDiscordHandle(e) {
            if (e) e.preventDefault();
            navigator.clipboard.writeText('xrxwastaken').then(() => {
                const popNotification = document.getElementById('toast');
                if (popNotification) {
                    popNotification.classList.add('active');
                    setTimeout(() => popNotification.classList.remove('active'), 3000);
                }
            });
        }

        syncSpotifyData();
        setInterval(syncSpotifyData, 20000);
    </script>
</body>
</html>
