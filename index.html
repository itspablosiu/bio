<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bio.nalogowiec.pl</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #060709;
            --icon-bg: rgba(255, 255, 255, 0.06);
            --icon-border: rgba(255, 255, 255, 0.15);
            --icon-hover-bg: rgba(255, 255, 255, 0.25);
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* TŁO MEDIA */
        #bgVideo {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.2) contrast(1.1);
            pointer-events: none;
        }

        /* GATEWAY STARTOWY */
        #gateway {
            position: fixed;
            inset: 0;
            background: #060709;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        #gateway.hide {
            opacity: 0;
            visibility: hidden;
        }
        .core-pulse {
            width: 16px;
            height: 16px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            animation: pulseCore 2s infinite ease-in-out;
        }

        @keyframes pulseCore {
            0%, 100% { transform: scale(0.8); opacity: 0.4; }
            50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 35px rgba(255, 255, 255, 0.9); }
        }

        /* SYSTEM ORBITALNY CONTAINER */
        .system-container {
            position: relative;
            z-index: 10;
            width: 380px;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: scale(0.85);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .system-container.active {
            opacity: 1;
            transform: scale(1);
        }

        /* CENTRUM / AVATAR */
        .center-core {
            position: relative;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }
        .center-core img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* ORBITY (pointer-events: none zapobiega blokowaniu kliknięć) */
        .orbit {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: rotateOrbit linear infinite;
            pointer-events: none;
        }

        .orbit-1 {
            width: 200px;
            height: 200px;
            animation-duration: 25s;
            z-index: 12;
        }

        .orbit-2 {
            width: 330px;
            height: 330px;
            animation-duration: 40s;
            animation-direction: reverse;
            z-index: 11;
        }

        /* IKONY SATELITARNE (odblokowane klikanie za pomocą pointer-events: auto) */
        .satellite {
            position: absolute;
            width: 48px;
            height: 48px;
            background: var(--icon-bg);
            border: 1px solid var(--icon-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            font-size: 18px;
            text-decoration: none;
            cursor: pointer;
            pointer-events: auto;
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Pozycjonowanie satelitów na orbicie 1 */
        .orbit-1 .sat-1 { top: -24px; left: calc(50% - 24px); }
        .orbit-1 .sat-2 { bottom: -24px; left: calc(50% - 24px); }
        .orbit-1 .sat-3 { left: -24px; top: calc(50% - 24px); }
        .orbit-1 .sat-4 { right: -24px; top: calc(50% - 24px); }

        /* Pozycjonowanie satelitów na orbicie 2 */
        .orbit-2 .sat-5 { top: 15px; left: 45px; }
        .orbit-2 .sat-6 { top: 15px; right: 45px; }
        .orbit-2 .sat-7 { bottom: 15px; left: 45px; }
        .orbit-2 .sat-8 { bottom: 15px; right: 45px; }

        /* Korygowanie obrotu samej ikony */
        .satellite i {
            animation: counterRotate linear infinite;
            pointer-events: none;
        }
        .orbit-1 .satellite i { animation-duration: 25s; }
        .orbit-2 .satellite i { animation-duration: 40s; animation-direction: reverse; }

        @keyframes rotateOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes counterRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        .satellite:hover {
            background: var(--icon-hover-bg);
            border-color: rgba(255, 255, 255, 0.6);
            transform: scale(1.25);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
            z-index: 20;
        }

        /* ETYKIETA HOVER POD SYSTEMEM */
        .tooltip-display {
            position: absolute;
            bottom: -50px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
            height: 20px;
            pointer-events: none;
        }

        /* BAR MEDIA & CONTROL DOŁU EKRANU */
        .bottom-controls {
            position: fixed;
            bottom: 24px;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            padding: 6px 14px;
            border-radius: 30px;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
        }
        .ctrl-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        #scrobble-info {
            display: none;
            align-items: center;
            gap: 8px;
            padding-left: 10px;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }
        .live-dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
        }
        #scrobble-link {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        #scrobble-link:hover { color: #fff; }

        /* TOAST */
        .toast {
            position: fixed;
            top: 30px;
            background: #ffffff;
            color: #000000;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transform: translateY(-40px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 10000;
            pointer-events: none;
        }
        .toast.active {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 420px) {
            .system-container { transform: scale(0.8); }
        }
    </style>
</head>
<body>

    <div id="toast" class="toast">Discord copied to clipboard</div>

    <!-- GATEWAY -->
    <div id="gateway" onclick="initOrbit()">
        <div class="core-pulse"></div>
    </div>

    <!-- TŁO MEDIA (brak obrazu podrzędnego, w razie błędu wideo zostaje schowane) -->
    <video id="bgVideo" loop muted playsinline onerror="this.style.display='none';">
        <source src="background.mp4" type="video/mp4">
    </video>

    <audio id="bgMusic" loop>
        <source src="02/background.mp3" type="audio/mpeg">
    </audio>

    <!-- SYSTEM ORBITALNY -->
    <div class="system-container" id="mainSystem">
        
        <!-- JĄDRO -->
        <div class="center-core">
            <img src="02/avatar.png" alt="Avatar">
        </div>

        <!-- WEWNĘTRZNA ORBITA -->
        <div class="orbit orbit-1">
            <a href="https://youtube.com/@pawissek" target="_blank" rel="noopener noreferrer" class="satellite sat-1" onmouseenter="showTag('YouTube')" onmouseleave="hideTag()">
                <i class="fab fa-youtube"></i>
            </a>
            <a href="https://github.com/itspablosiu" target="_blank" rel="noopener noreferrer" class="satellite sat-2" onmouseenter="showTag('GitHub')" onmouseleave="hideTag()">
                <i class="fab fa-github"></i>
            </a>
            <a href="https://instagram.com/pawissek" target="_blank" rel="noopener noreferrer" class="satellite sat-3" onmouseenter="showTag('Instagram')" onmouseleave="hideTag()">
                <i class="fab fa-instagram"></i>
            </a>
            <button onclick="copyDiscord()" class="satellite sat-4" onmouseenter="showTag('Discord')" onmouseleave="hideTag()">
                <i class="fab fa-discord"></i>
            </button>
        </div>

        <!-- ZEWNĘTRZNA ORBITA -->
        <div class="orbit orbit-2">
            <a href="https://steamcommunity.com/id/pawissek/" target="_blank" rel="noopener noreferrer" class="satellite sat-5" onmouseenter="showTag('Steam')" onmouseleave="hideTag()">
                <i class="fab fa-steam"></i>
            </a>
            <a href="https://x.com/pablosiu_" target="_blank" rel="noopener noreferrer" class="satellite sat-6" onmouseenter="showTag('Twitter / X')" onmouseleave="hideTag()">
                <i class="fab fa-x-twitter"></i>
            </a>
            <a href="https://twitch.tv/pablosiu_" target="_blank" rel="noopener noreferrer" class="satellite sat-7" onmouseenter="showTag('Twitch')" onmouseleave="hideTag()">
                <i class="fab fa-twitch"></i>
            </a>
            <a href="https://last.fm/user/arkadivsz" target="_blank" rel="noopener noreferrer" class="satellite sat-8" onmouseenter="showTag('Last.fm')" onmouseleave="hideTag()">
                <i class="fab fa-lastfm"></i>
            </a>
        </div>

        <div class="tooltip-display" id="tooltip"></div>
    </div>

    <!-- DOLNY PASEK AUDIO & LAST.FM -->
    <div class="bottom-controls">
        <button class="ctrl-btn" onclick="toggleAudio()" title="Pause/Play">
            <i class="fas fa-pause" id="playIcon"></i>
        </button>
        <button class="ctrl-btn" onclick="toggleMute()" title="Mute/Unmute">
            <i class="fas fa-volume-up" id="muteIcon"></i>
        </button>

        <div id="scrobble-info">
            <div class="live-dot"></div>
            <a id="scrobble-link" href="#" target="_blank" title="Now Playing">
                <i class="fas fa-music"></i>
            </a>
        </div>
    </div>

    <script>
        const audio = document.getElementById('bgMusic');
        const video = document.getElementById('bgVideo');

        function initOrbit() {
            document.getElementById('gateway').classList.add('hide');
            document.getElementById('mainSystem').classList.add('active');

            if (video) {
                video.play().catch(() => {
                    video.style.display = 'none';
                });
            }
            if (audio) {
                audio.volume = 0.2;
                audio.play().catch(() => {});
            }
        }

        function showTag(text) {
            document.getElementById('tooltip').innerText = text;
        }

        function hideTag() {
            document.getElementById('tooltip').innerText = '';
        }

        function toggleAudio() {
            const icon = document.getElementById('playIcon');
            if (!audio) return;
            if (audio.paused) {
                audio.play().catch(() => {});
                icon.className = "fas fa-pause";
            } else {
                audio.pause();
                icon.className = "fas fa-play";
            }
        }

        function toggleMute() {
            const icon = document.getElementById('muteIcon');
            if (!audio) return;
            audio.muted = !audio.muted;
            icon.className = audio.muted ? "fas fa-volume-mute" : "fas fa-volume-up";
        }

        const LF_USER = "arkadivsz";
        const LF_KEY = "0d22a6285362338637e9fe9eb97a1fd0";

        async function fetchLiveTrack() {
            if(!LF_USER || !LF_KEY) return;
            try {
                const res = await fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LF_USER}&api_key=${LF_KEY}&format=json&limit=1`);
                const json = await res.json();
                const track = json?.recenttracks?.track?.[0];
                const active = track?.['@attr']?.nowplaying === 'true';

                const container = document.getElementById('scrobble-info');
                const link = document.getElementById('scrobble-link');
                
                if(active && track) {
                    container.style.display = 'flex';
                    const artist = track.artist['#text'];
                    const name = track.name;
                    link.title = `Now listening: ${artist} - ${name}`;
                    link.href = `https://open.spotify.com/search/${encodeURIComponent(artist + " " + name)}`;
                } else {
                    container.style.display = 'none';
                }
            } catch(e) {}
        }

        function copyDiscord() {
            navigator.clipboard.writeText('pawissek').then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('active');
                setTimeout(() => toast.classList.remove('active'), 2000);
            });
        }

        fetchLiveTrack();
        setInterval(fetchLiveTrack, 20000);
    </script>
</body>
</html>
