<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bio.nalogowiec.pl</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i> Twój Nick Discord został skopiowany!
    </div>

    <div id="gateway" onclick="initPage()">
        <div class="gateway-content">
            <div class="core-pulse"></div>
            <span class="gateway-text">KLIKNIJ, ABY WEJŚĆ</span>
        </div>
    </div>

    <video id="bgVideo" loop muted playsinline onerror="this.style.display='none';">
        <source src="background.mp4" type="video/mp4">
    </video>

    <audio id="bgMusic" loop>
        <source src="kosztbyciaboss.mp3" type="audio/mpeg">
    </audio>

    <main class="bio-card" id="mainCard">
        <div class="profile-header">
            <div class="avatar-wrapper">
                <div class="avatar-glow"></div>
                <img src="avatar2.png" alt="Avatar" class="avatar-img">
            </div>
            <h1 class="profile-title">pawissek</h1>
            <p class="profile-subtitle">bio.nalogowiec.pl</p>
        </div>

        <div class="links-grid">
            <a href="https://youtube.com/@pawissek" target="_blank" rel="noopener noreferrer" class="social-btn">
                <i class="fab fa-youtube"></i>
                <span>YouTube</span>
            </a>
            <a href="https://github.com/itspablosiu" target="_blank" rel="noopener noreferrer" class="social-btn">
                <i class="fab fa-github"></i>
                <span>GitHub</span>
            </a>
            <a href="https://instagram.com/pawissek" target="_blank" rel="noopener noreferrer" class="social-btn">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
            </a>
            <button onclick="copyDiscord()" class="social-btn">
                <i class="fab fa-discord"></i>
                <span>Discord</span>
            </button>
            <a href="https://steamcommunity.com/id/pawissek/" target="_blank" rel="noopener noreferrer" class="social-btn">
                <i class="fab fa-steam"></i>
                <span>Steam</span>
            </a>
            <a href="https://x.com/pablosiu_" target="_blank" rel="noopener noreferrer" class="social-btn">
                <i class="fab fa-x-twitter"></i>
                <span>Twitter / X</span>
            </a>
            <a href="https://twitch.tv/pablosiu_" target="_blank" rel="noopener noreferrer" class="social-btn">
                <i class="fab fa-twitch"></i>
                <span>Twitch</span>
            </a>
            <a href="https://last.fm/user/arkadivsz" target="_blank" rel="noopener noreferrer" class="social-btn">
                <i class="fab fa-lastfm"></i>
                <span>Last.fm</span>
            </a>
        </div>
    </main>

    <footer class="bottom-controls">
        <button class="ctrl-btn" onclick="toggleAudio()" title="Pause/Play">
            <i class="fas fa-pause" id="playIcon"></i>
        </button>

        <div class="track-info">
            <img id="trackCover" src="cover.jpg" alt="Cover" class="track-cover">
            <div class="track-details">
                <span class="track-title" id="trackTitle">Ładowanie...</span>
                <span class="track-artist" id="trackArtist">Nieznany Wykonawca</span>
            </div>
        </div>

        <div class="volume-container">
            <i class="fas fa-volume-down volume-icon" id="volIcon" onclick="quickMuteToggle()"></i>
            <input type="range" class="volume-slider" id="volSlider" min="0" max="1" step="0.01" value="0.2" oninput="changeVolume(this.value)">
        </div>

        <div class="audio-progress-container">
            <span class="time-text" id="currentTime">0:00</span>
            <div class="progress-bar" onclick="seekAudio(event)">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="time-text" id="durationTime">0:00</span>
        </div>

        <div id="scrobble-info">
            <div class="live-dot" title="Słuchane na żywo"></div>
            <a id="scrobble-link" href="#" target="_blank" title="Otwórz w Spotify">
                <i class="fab fa-spotify"></i>
            </a>
        </div>
    </footer>

    <script>
        const DEFAULT_TRACK = {
            title: "KOSZT BYCIA BOSS",
            artist: "Kubi Producent, Bedoes 2115, kuqe 2115, Szpaku",
            cover: "cover.jpg"
        };

        const audio = document.getElementById('bgMusic');
        const video = document.getElementById('bgVideo');
        let previousVolume = 0.2;

        setTrackMetadata(DEFAULT_TRACK.title, DEFAULT_TRACK.artist, DEFAULT_TRACK.cover);

        function setTrackMetadata(title, artist, coverUrl) {
            document.getElementById('trackTitle').innerText = title;
            document.getElementById('trackArtist').innerText = artist;
            const coverEl = document.getElementById('trackCover');
            coverEl.src = coverUrl || DEFAULT_TRACK.cover;
        }

        function initPage() {
            document.getElementById('gateway').classList.add('hide');
            document.getElementById('mainCard').classList.add('active');

            if (video) {
                video.play().catch(() => { video.style.display = 'none'; });
            }
            if (audio) {
                audio.volume = parseFloat(document.getElementById('volSlider').value);
                audio.play().catch(() => {});
            }

            fetchLiveTrack();
            setInterval(fetchLiveTrack, 15000);
        }

        function toggleAudio() {
            const icon = document.getElementById('playIcon');
            if (!audio) return;
            if (audio.paused) {
                audio.play().catch(() => {});
                icon.className = "fas fa-pause";
            } else {
                audio.pause();
                icon.className = "fas fa-play";
            }
        }

        function changeVolume(val) {
            if (!audio) return;
            audio.volume = val;
            updateVolIcon(val);
        }

        function updateVolIcon(val) {
            const icon = document.getElementById('volIcon');
            const v = parseFloat(val);
            if (v === 0) icon.className = "fas fa-volume-mute volume-icon";
            else if (v < 0.5) icon.className = "fas fa-volume-down volume-icon";
            else icon.className = "fas fa-volume-up volume-icon";
        }

        function quickMuteToggle() {
            if (!audio) return;
            const slider = document.getElementById('volSlider');
            if (audio.volume > 0) {
                previousVolume = audio.volume;
                audio.volume = 0;
                slider.value = 0;
            } else {
                audio.volume = previousVolume > 0 ? previousVolume : 0.2;
                slider.value = audio.volume;
            }
            updateVolIcon(slider.value);
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        if (audio) {
            audio.addEventListener('timeupdate', () => {
                if (!audio.duration) return;
                const pct = (audio.currentTime / audio.duration) * 100;
                document.getElementById('progressFill').style.width = pct + '%';
                document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
                document.getElementById('durationTime').innerText = formatTime(audio.duration);
            });
        }

        function seekAudio(event) {
            if (!audio || !audio.duration) return;
            const bar = event.currentTarget;
            const rect = bar.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const pct = clickX / rect.width;
            audio.currentTime = pct * audio.duration;
        }

        const LF_USER = "arkadivsz";
        const LF_KEY = "0d22a6285362338637e9fe9eb97a1fd0";

        async function fetchLiveTrack() {
            if (!LF_USER || !LF_KEY) return;
            try {
                const res = await fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LF_USER}&api_key=${LF_KEY}&format=json&limit=1`);
                const json = await res.json();
                const track = json?.recenttracks?.track?.[0];
                const active = track?.['@attr']?.nowplaying === 'true';

                const container = document.getElementById('scrobble-info');
                const link = document.getElementById('scrobble-link');
                
                if (active && track) {
                    const artist = track.artist['#text'];
                    const name = track.name;
                    const coverUrl = track.image?.[2]?.['#text'] || track.image?.[1]?.['#text'] || DEFAULT_TRACK.cover;
                    
                    setTrackMetadata(name, artist, coverUrl);
                    container.style.display = 'flex';
                    link.title = `Słuchasz na żywo: ${artist} - ${name}`;
                    link.href = `https://open.spotify.com/search/${encodeURIComponent(artist + " " + name)}`;
                } else {
                    setTrackMetadata(DEFAULT_TRACK.title, DEFAULT_TRACK.artist, DEFAULT_TRACK.cover);
                    container.style.display = 'none';
                }
            } catch(e) {}
        }

        function copyDiscord() {
            navigator.clipboard.writeText('pawissek').then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('active');
                setTimeout(() => toast.classList.remove('active'), 2500);
            });
        }
    </script>
</body>
</html>
