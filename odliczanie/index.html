<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Odliczanie OBS z Kontrolą</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: transparent;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.8);
      user-select: none;
    }

    .container {
      position: relative;
      text-align: center;
      background: rgba(0, 0, 0, 0.7);
      padding: 2.5rem 4rem;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 1.5rem;
      color: #e0e0e0;
    }

    .timer {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      align-items: center;
    }

    .time-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 90px;
    }

    .number {
      font-size: 4.5rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 0.5rem;
      color: #a0a0a0;
    }

    .separator {
      font-size: 3.5rem;
      font-weight: 300;
      margin-top: -1rem;
      color: #ff4757;
    }

    .live-text {
      display: none;
      font-size: 4rem;
      font-weight: 900;
      color: #ff4757;
      text-transform: uppercase;
      letter-spacing: 5px;
      animation: pulse 1.5s infinite;
    }

    /* Panel sterowania – ukryty domyślnie, widoczny po najechaniu myszką */
    .controls {
      position: absolute;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(15, 15, 15, 0.95);
      padding: 8px 15px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      opacity: 0;
      transition: opacity 0.3s ease, bottom 0.3s ease;
      pointer-events: none;
    }

    /* Pokaż przyciski po najechaniu na kartę */
    .container:hover .controls {
      opacity: 1;
      bottom: -25px;
      pointer-events: auto;
    }

    button {
      background: #2f3542;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #ff4757;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 id="title">Transmisja rozpocznie się za</h1>
    
    <div class="timer" id="timer">
      <div class="time-block">
        <span class="number" id="minutes">05</span>
        <span class="label">Minut</span>
      </div>
      <span class="separator">:</span>
      <div class="time-block">
        <span class="number" id="seconds">00</span>
        <span class="label">Sekund</span>
      </div>
    </div>

    <div class="live-text" id="live-text">ZACZYNAMY!</div>

    <!-- Przyciski sterujące -->
    <div class="controls">
      <button onclick="addTime(-60)">-1 min</button>
      <button onclick="togglePause()" id="pause-btn">Pauza</button>
      <button onclick="addTime(60)">+1 min</button>
      <button onclick="addTime(300)">+5 min</button>
      <button onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <script>
    const INITIAL_MINUTES = 5; // Czas początkowy
    let timeLeft = INITIAL_MINUTES * 60; // w sekundach
    let isPaused = false;
    let timerInterval = null;

    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const timerEl = document.getElementById('timer');
    const titleEl = document.getElementById('title');
    const liveTextEl = document.getElementById('live-text');
    const pauseBtn = document.getElementById('pause-btn');

    function render() {
      if (timeLeft <= 0) {
        timeLeft = 0;
        clearInterval(timerInterval);
        timerEl.style.display = 'none';
        titleEl.style.display = 'none';
        liveTextEl.style.display = 'block';
      } else {
        timerEl.style.display = 'flex';
        titleEl.style.display = 'block';
        liveTextEl.style.display = 'none';
      }

      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;

      minutesEl.textContent = String(m).padStart(2, '0');
      secondsEl.textContent = String(s).padStart(2, '0');
    }

    function tick() {
      if (!isPaused && timeLeft > 0) {
        timeLeft--;
        render();
      }
    }

    function togglePause() {
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? "Wznów" : "Pauza";
      pauseBtn.style.background = isPaused ? "#2ed573" : "#2f3542";
    }

    function addTime(seconds) {
      timeLeft += seconds;
      if (timeLeft < 0) timeLeft = 0;
      render();
    }

    function resetTimer() {
      timeLeft = INITIAL_MINUTES * 60;
      isPaused = false;
      pauseBtn.textContent = "Pauza";
      pauseBtn.style.background = "#2f3542";
      render();
    }

    // Start odliczania
    render();
    timerInterval = setInterval(tick, 1000);
  </script>
</body>
</html>
