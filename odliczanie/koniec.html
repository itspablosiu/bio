<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Zakończenie Streama - OBS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: transparent; /* Przezroczyste tło pod OBS */
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.8);
      user-select: none;
    }

    .container {
      text-align: center;
      background: rgba(0, 0, 0, 0.7);
      padding: 3.5rem 5rem;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      max-width: 800px;
      animation: fadeIn 1s ease-out;
    }

    h1 {
      font-size: 3.2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 1rem;
      background: linear-gradient(45deg, #ffffff, #ff4757);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulseGlow 3s infinite alternate;
    }

    p {
      font-size: 1.3rem;
      color: #d1d8e0;
      letter-spacing: 1.5px;
      font-weight: 300;
      line-height: 1.6;
    }

    .socials {
      margin-top: 2rem;
      font-size: 1rem;
      color: #a0a0a0;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Animacja wejścia */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Subtelny puls dla nagłówka */
    @keyframes pulseGlow {
      0% {
        filter: drop-shadow(0 0 5px rgba(255, 71, 87, 0.2));
      }
      100% {
        filter: drop-shadow(0 0 20px rgba(255, 71, 87, 0.6));
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Dzięki za obecność!</h1>
    <p>Transmisja dobiegła końca. Widzimy się następnym razem!</p>
    
    <!-- Opcjonalna sekcja na Twoje social media -->
    <div class="socials">
      Pawissek idzie spać :3
    </div>
  </div>

</body>
</html>
